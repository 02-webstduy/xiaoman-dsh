# 小满的配置。改完重启服务生效。
# 密钥不写在这里：需要时用环境变量 XIAOMAN_API_KEY。

[app]
name = "小满"
host = "127.0.0.1"
port = 8765
# 「认识你的第几天」从这里算起
started_on = "2026-10-27"

[model]
base_url = "http://vllm-qwen:8000/v1"
model = "/workspace/models/Qwen2.5-7B-AWQ"
temperature = 0.6
max_tokens = 400
timeout_s = 60
# 送进模型的历史消息条数上限（一步还没有长期记忆）
max_history = 20
